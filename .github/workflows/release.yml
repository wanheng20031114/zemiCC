name: Windows release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: node -e "const v=require('./package.json').version; if(process.env.GITHUB_REF_NAME!=='v'+v) throw new Error('Tag and package versions must match');"
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Launch the standalone application
        shell: pwsh
        run: ./scripts/smoke-desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zemiCC-windows-${{ github.ref_name }}
          path: |
            release/zemiCC-Setup-*-x64.exe
            release/zemiCC-*-win-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          $assets = @(Get-ChildItem release/zemiCC-Setup-*-x64.exe, release/zemiCC-*-win-x64.zip, release/SHA256SUMS.txt | ForEach-Object FullName)
          $options = @('--verify-tag', '--title', "zemiCC $tag")
          if (Test-Path -LiteralPath $notes) { $options += @('--notes-file', $notes) } else { $options += '--generate-notes' }
          gh release create $tag @assets @options
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
